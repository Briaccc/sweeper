name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sweeper .
      - name: runs as uid 1000, not root
        run: test "$(docker run --rm sweeper id -u):$(docker run --rm sweeper id -g)" = "1000:1000"
      - name: refuses a config folder it cannot write, with a clear message
        run: |
          mkdir -p ro && chmod 755 ro
          ! timeout 60 docker run --rm -v "$PWD/ro:/config" sweeper 2> err.txt
          grep -q "not writable" err.txt
      - name: first start with an empty config volume
        run: |
          mkdir -p cfg && sudo chown 1000:1000 cfg
          docker run -d --name sweeper -p 127.0.0.1:29320:29320 -v "$PWD/cfg:/config" sweeper
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:29320/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:29320/ | grep -q "<title>sweeper"
          sudo test -f cfg/config.toml
          docker exec sweeper python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29320/', timeout=5)"
          docker logs sweeper

  # Publish the image once everything above passes: `latest` from main,
  # plus version tags when a v1.2.3 tag is pushed.
  publish:
    needs: [test, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: image name (registry names are lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sweeper" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
